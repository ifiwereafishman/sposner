<!DOCTYPE html>

<html>
<style>
            

a {
text-decoration: none;
transition: all 0.3s ease;    
 }


a:hover { 
text-decoration: underline;
transition: all 0.3s ease;
 } 

.vertical-stack {
 display: flex;
flex-direction: column;
gap: 10px;
text-align: center;
justify-content: center; 
align-items: center;
min-height: 100vh;
font-family:futura;
}


.image-container {
  position: relative;
  display: flex;
justify-content: center;
align-items: center;
height: 300px;
}

.image-container img {
  display: block;
  width: 400px;
  height: 400px;
}

.image-container .popup-text {
  position: absolute;
  top: 50%;
  left: 50%;
  transform: translate(-50%, -50%);
  background-color: rgba(0, 0, 0, 0.8); /* Semi-transparent black background */
  color: white;
  padding: 10px 15px;
  border-radius: 5px;
  font-family: futura;
  white-space: nowrap;

opacity: 0;
  transition: opacity 0.3s ease; 
  pointer-events: none; /* Prevents flickering */
}

.image-container:hover .popup-text {
  opacity: 1;
}
 

            
</style>

<div class="vertical-stack image-container">
  <img src="Layout2.jpg" alt="Minnesota Pipeline Area of Effect">
  <div class="popup-text"> A map of the area of effect of potential oil spills (and their proximity to native reservations) in Minnesota</div>
</div>

</div>

</html>
